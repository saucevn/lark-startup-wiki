name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for tag
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          awk "/^## \[${TAG#v}\]/,/^## \[/" CHANGELOG.md | sed '$d' > release-notes.md || echo "See CHANGELOG.md" > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false

  publish-npm:
    name: Publish create-lark-startup-wiki to npm
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        working-directory: packages/create-lark-startup-wiki
        run: npm ci || npm install
      - name: Publish
        working-directory: packages/create-lark-startup-wiki
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
