name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-plugin:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin.json is valid JSON
        run: python -c "import json; json.load(open('.claude-plugin/plugin.json'))"
      - name: Check marketplace.json is valid JSON
        run: python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

  python-scripts:
    name: Python scripts (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Syntax check all scripts
        run: |
          for f in scripts/*.py; do python -c "import ast; ast.parse(open('$f').read())" || exit 1; done
      - name: Run unit tests (no credentials needed)
        run: python -m pytest scripts/tests/ -v
        continue-on-error: true

  scaffolder:
    name: Scaffolder smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install scaffolder deps
        working-directory: packages/create-lark-startup-wiki
        run: npm ci || npm install
      - name: Syntax check
        working-directory: packages/create-lark-startup-wiki
        run: node -c bin/cli.js
      - name: Dry-run scaffold
        working-directory: packages/create-lark-startup-wiki
        run: node bin/cli.js test-output --no-interactive --dry-run

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: |
            **/*.md
            !node_modules
            !templates/**/*.md.tmpl
        continue-on-error: true
